<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>لولوه · إدارة المدونة</title>
    <link rel="icon" href="/lulwa-mark.svg" type="image/svg+xml" />
    <style>
      /* Lulwa look: the site's Arabic body font, and Sveltia's one base hue set to Lulwa teal (#0f6e7a = hue 187), which tints every accent in light and dark. html:root beats the :root rule Sveltia injects. */
      @font-face { font-family: 'IBM Plex Sans Arabic'; src: url('/fonts/plex-arabic-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
      @font-face { font-family: 'IBM Plex Sans Arabic'; src: url('/fonts/plex-arabic-500.woff2') format('woff2'); font-weight: 500 700; font-display: swap; }
      html:root { --sui-base-hue: 187; --sui-font-family-default: 'IBM Plex Sans Arabic', 'Source Sans 3', system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <!-- Sveltia CMS, pinned version. Served at https://cms.lulwa.com.sa/ (docroot public_html/cms); lulwa.com.sa/cms 301s there, so / here means this folder. Config is inline below; headers in .htaccess beside this file. -->
    <script>window.CMS_MANUAL_INIT = true;</script>
    <script src="https://unpkg.com/@sveltia/cms@0.256.1/dist/sveltia-cms.js" integrity="sha384-LPT86oZkLhmoF84O1jKZBSaFJOVvKv8sjXDKap1SOaSwzbC8F6HH7rTJWekmAzG9" crossorigin="anonymous"></script>
    <script>
      // Sveltia CMS for the blog (client request, 13 Nov 2026). Docs: https://sveltiacms.app/en/docs
      // Writes one file per post to src/content/blog/<slug>.json on main; the push runs deploy.yml, which checks and deploys.
      // Sign-in: GitHub OAuth through https://cms.lulwa.com.sa/auth.php (only the GitHub users listed on the server can sign in) or a GitHub token.

      // Same list as BANNED in scripts/check-guides.mjs, which fails the deploy on these; the editor stops them first. Change both together.
      const banned = /24\s?ساعة|على مدار الساعة|24\/7|نفس اليوم|same[- ]day|معتمد|certified|أصلية|original parts|genuine|ضمان|warrant|ريال|\bSAR\b|خلال ساعة|زيارة منزلية|home visit|we come to you|الأفضل|أفضل ورشة|أفضل فني|\bthe best\b|فوري|5,?000|10\+|98\s?%|4\.9|!|\*\*|<[a-z]|لولوه (?:تصلح|تقدم|توفر|تخدم|ترد)|نخدم (?!عملاء)|نغطي|we serve\b|we cover\b|service report|تقرير خدمة|غير المؤكد|المؤكدة|unconfirmed|confirmed|بعض المواقع|مواقع أخرى|شركات أخرى|other shops|some websites|للمنازل والمنشآت|نأتي إليك|في موقعك|[\uD83C-\uD83E][\uDC00-\uDFFF]|(?<!\d)(?!056 802 2197(?!\d))0?5\d(?:\s?\d){7,8}(?!\d)/i;
      const clean = {
        pattern: [
          new RegExp(`^(?![\\s\\S]*(?:${banned.source}))[\\s\\S]*$`, 'i'),
          'كلمة ممنوعة: لا ادعاءات (24 ساعة، نفس اليوم، ضمان، معتمد، قطع أصلية، الأفضل، أسعار) ولا علامة تعجب · Not allowed: claims such as 24 hours, same day, warranty, certified, original parts, the best, prices, or "!" · رقم الجوال يكتب هكذا فقط: 056 802 2197 · The phone number is written only as 056 802 2197',
        ],
      };
      // Same value in both languages, edited on the Arabic side.
      const shared = { i18n: 'duplicate' };
      const text = (name, label, extra = {}) => ({ name, label, widget: 'string', i18n: true, ...clean, ...extra });

      CMS.init({
        config: {
          load_config_file: false,
          backend: {
            name: 'github',
            repo: 'envyxyz/lulwa-website',
            branch: 'main',
            base_url: 'https://cms.lulwa.com.sa',
            auth_endpoint: 'auth.php',
            commit_messages: {
              create: 'cms: create {{collection}} {{slug}} ({{author-login}})',
              update: 'cms: update {{collection}} {{slug}} ({{author-login}})',
              delete: 'cms: delete {{collection}} {{slug}} ({{author-login}})',
              uploadMedia: 'cms: upload {{path}} ({{author-login}})',
              deleteMedia: 'cms: delete {{path}} ({{author-login}})',
            },
          },
          site_url: 'https://lulwa.com.sa',
          app_title: 'لولوه · إدارة المدونة',
          logo: { src: '/lulwa-mark.svg', show_in_header: true },
          media_folder: 'public/images/blog',
          public_folder: '/images/blog',
          // Every upload becomes a WebP no larger than 1200 px, so a phone photo does not slow the page.
          media_libraries: { default: { config: { max_file_size: 15000000, transformations: { raster_image: { format: 'webp', quality: 75, width: 1200, height: 1200 } } } } },
          i18n: { structure: 'single_file', locales: ['ar', 'en'], default_locale: 'ar' },
          collections: [
            {
              name: 'blog',
              label: 'المدونة · Blog',
              label_singular: 'مقال · Post',
              description: 'كل مقال بالعربي والإنجليزي. يظهر في الموقع بعد الحفظ بحوالي 10 دقائق، إلا إذا كان مسودة أو تاريخه في المستقبل. · Each post in Arabic and English. It goes live about 10 minutes after saving, unless it is a draft or dated in the future.',
              folder: 'src/content/blog',
              extension: 'json',
              format: 'json',
              create: true,
              // A deleted post leaves a dead link in Google. Unpublish with Draft, or ask Ameer.
              delete: false,
              i18n: true,
              // The 3 legacy posts keep their ranked meta, which is longer than the limits below, so they stay out of the editor.
              filter: { field: 'slug', pattern: '^(?!(?:ac-repair-in-dammam|ac-repair-installation-maintenance-in-dammam-the-complete-guide|washing-machine-maintenance-repair-services-in-dammam)$)' },
              identifier_field: 'h1',
              // The file name is the address: /blog/<slug> and /en/blog/<slug>. Set from the slug field on the first save, then fixed (posts.ts reads the file name).
              slug: { template: '{{fields.slug}}', editable: false },
              summary: "{{h1}} · {{date}}{{draft | ternary(' · مسودة Draft', '')}}",
              sortable_fields: { fields: ['date', 'h1'], default: { field: 'date', direction: 'descending' } },
              view_filters: [
                { label: 'مسودات · Drafts', field: 'draft', pattern: true },
                { label: 'منشورة · Published', field: 'draft', pattern: false },
              ],
              preview_path: '/blog/{{slug}}',
              fields: [
                { name: 'slug', label: 'عنوان الصفحة (slug)', widget: 'string', ...shared, required: true, minlength: 10, maxlength: 60, pattern: ['^(?!(?:ac-repair-in-dammam|ac-repair-installation-maintenance-in-dammam-the-complete-guide|washing-machine-maintenance-repair-services-in-dammam)$)[a-z0-9]+(?:-[a-z0-9]+)*$', 'حروف إنجليزية صغيرة وأرقام وشرطات فقط · Lowercase English letters, digits and hyphens only'], hint: 'عنوان الصفحة بالإنجليزي: حروف صغيرة وشرطات، مثل ac-not-cooling-in-summer، من 10 إلى 60 حرف. يثبت بعد أول حفظ ولا يتغير. · The page address in English: lowercase letters and hyphens, e.g. ac-not-cooling-in-summer, 10 to 60 characters. Fixed after the first save.' },
                { name: 'draft', label: 'مسودة (مخفي من الموقع) · Draft (hidden)', widget: 'boolean', ...shared, default: true, hint: 'اتركها مفعلة حتى يجهز المقال باللغتين. · Keep on until both languages are ready. لإخفاء مقال منشور فعلها مرة أخرى. · Switch it back on to take a published post off the site.' },
                { name: 'date', label: 'تاريخ النشر · Publish date', widget: 'datetime', ...shared, time_format: false, format: 'YYYY-MM-DD', default: '{{now}}', hint: 'تاريخ في المستقبل = نشر مجدول، يظهر صباح ذلك اليوم. · A future date schedules the post; it goes live that morning.' },
                { name: 'image', label: 'الصورة الرئيسية · Featured image', widget: 'image', ...shared, required: false, hint: 'صورة حقيقية من عمل لولوه، بالعرض. لا صور ذكاء اصطناعي للورشة أو الفنيين. · A real Lulwa job photo, landscape. No AI images of the shop or technicians.' },
                text('image_alt', 'وصف الصورة · Image description (alt)', { required: false, maxlength: 125, hint: 'جملة تصف ما في الصورة لمن لا يراها، حتى 125 حرف. · One sentence describing what the photo shows, up to 125 characters.' }),
                // Heading limits come from tests/headlines.spec.ts (T11): two lines at 320 px, measured 13 Nov 2026 (English H1 37, H2 47, H3 41 characters).
                text('title','عنوان جوجل (SEO title)', { minlength: 30, maxlength: 60, hint: 'يظهر في نتائج البحث، من 30 إلى 60 حرف، والكلمة المهمة أولا. · Shown in Google results, 30 to 60 characters, main keyword first.' }),
                { name: 'description', label: 'وصف جوجل (meta description)', widget: 'text', i18n: true, ...clean, minlength: 120, maxlength: 160, hint: 'يجيب عن سؤال الباحث في سطرين، من 120 إلى 160 حرف. · Answers the searcher\'s question in a line or two, 120 to 160 characters.' },
                text('h1', 'العنوان في الصفحة (H1) · Headline', { minlength: 15, maxlength: 36, hint: 'صياغته تختلف قليلا عن عنوان جوجل، من 15 إلى 36 حرف. · Worded a little differently from the Google title, 15 to 36 characters.' }),
                { name: 'lead', label: 'المقدمة · Intro line', widget: 'text', i18n: true, ...clean, minlength: 50, maxlength: 200 },
                {
                  name: 'sections',
                  label: 'الأقسام · Sections',
                  label_singular: 'قسم · Section',
                  widget: 'list',
                  i18n: 'duplicate',
                  min: 3,
                  summary: '{{h}}',
                  hint: 'أضف الأقسام في العربي، وتظهر نفسها في الإنجليزي لتكتب ترجمتها. · Add sections on the Arabic side; they appear on the English side for the translation.',
                  fields: [
                    text('h', 'عنوان القسم (H2) · Section heading', { maxlength: 45, hint: 'حتى 45 حرف. · Up to 45 characters.' }),
                    { name: 'p', label: 'النص · Text', widget: 'text', i18n: true, ...clean, hint: 'افصل بين الفقرات بسطر فارغ. · Leave an empty line between paragraphs.' },
                    {
                      name: 'items',
                      label: 'نقاط بعناوين (اختياري) · Sub-points (optional)',
                      label_singular: 'نقطة · Point',
                      widget: 'list',
                      i18n: 'duplicate',
                      required: false,
                      summary: '{{h}}',
                      fields: [text('h', 'عنوان النقطة (H3) · Point heading', { maxlength: 40, hint: 'حتى 40 حرف. · Up to 40 characters.' }), { name: 'p', label: 'النص · Text', widget: 'text', i18n: true, ...clean }],
                    },
                  ],
                },
                {
                  name: 'faq',
                  label: 'أسئلة شائعة · FAQ',
                  label_singular: 'سؤال · Question',
                  widget: 'list',
                  i18n: 'duplicate',
                  required: true,
                  min: 3,
                  max: 8,
                  summary: '{{q}}',
                  hint: 'من 3 إلى 8 أسئلة يسألها العملاء فعلا، بإجابات قصيرة. تظهر في جوجل. · 3 to 8 questions customers really ask, short answers. Google can show them.',
                  fields: [text('q', 'السؤال · Question', { minlength: 15, maxlength: 110 }), { name: 'a', label: 'الجواب · Answer', widget: 'text', i18n: true, ...clean, minlength: 40, maxlength: 400 }],
                },
              ],
            },
            {
              name: 'plan',
              label: 'خطة المحتوى · Content plan',
              label_singular: 'فكرة · Idea',
              folder: 'planner/ideas',
              extension: 'json',
              format: 'json',
              create: true,
              delete: true,
              editor: { preview: false },
              identifier_field: 'title',
              slug: '{{fields.slug}}',
              summary: '{{planned}} · {{status}} · {{title}} ({{keyword}})',
              view_groups: [{ label: 'الحالة · Status', field: 'status' }],
              sortable_fields: { fields: ['planned', 'status'], default: { field: 'planned', direction: 'ascending' } },
              fields: [
                { name: 'title', label: 'الفكرة · Idea', widget: 'string' },
                { name: 'slug', label: 'العنوان المقترح · Suggested slug', widget: 'string', required: false },
                { name: 'keyword', label: 'عبارة البحث · Search phrase', widget: 'string' },
                { name: 'language', label: 'اللغة · Language', widget: 'select', default: 'both', options: [{ label: 'عربي · Arabic', value: 'ar' }, { label: 'إنجليزي · English', value: 'en' }, { label: 'الاثنان · Both', value: 'both' }] },
                { name: 'planned', label: 'موعد النشر · Planned release', widget: 'datetime', time_format: false, format: 'YYYY-MM-DD' },
                { name: 'status', label: 'الحالة · Status', widget: 'select', default: 'idea', options: [{ label: 'فكرة · Idea', value: 'idea' }, { label: 'قيد الكتابة · Writing', value: 'writing' }, { label: 'جاهز · Ready', value: 'ready' }, { label: 'منشور · Published', value: 'published' }] },
                { name: 'notes', label: 'ملاحظات · Notes', widget: 'text', required: false },
              ],
            },
          ],
          singletons: [
            {
              name: 'checklist',
              label: 'قائمة المهام · Checklist',
              file: 'planner/checklist.json',
              format: 'json',
              fields: [
                {
                  name: 'items',
                  label: 'المهام · Tasks',
                  label_singular: 'مهمة · Task',
                  widget: 'list',
                  summary: "{{done | ternary('✓', '○')}} {{task}}",
                  hint: 'علم على ما انتهى، وأضف أو احذف أو رتب المهام كما تريد. لا يظهر شيء منها في الموقع. · Tick what is done; add, remove or reorder tasks as you like. None of it appears on the website.',
                  fields: [
                    { name: 'done', label: 'تم · Done', widget: 'boolean', default: false },
                    { name: 'task', label: 'المهمة · Task', widget: 'string' },
                  ],
                },
              ],
            },
            {
              name: 'tips',
              label: 'نصائح الكتابة · Writing tips',
              file: 'planner/seo-tips.json',
              format: 'json',
              fields: [
                { name: 'ar', label: 'العربية', widget: 'richtext' },
                { name: 'en', label: 'English', widget: 'richtext' },
              ],
            },
          ],
        },
      });
    </script>
  </body>
</html>
